{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Pages">
  {% if page.has_previous %}<a class="btn" href="{% querystring page=page.previous_page_number %}">Previous</a>{% else %}<span></span>{% endif %}
  <span class="muted small">Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} in total</span>
  {% if page.has_next %}<a class="btn" href="{% querystring page=page.next_page_number %}">Next</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
