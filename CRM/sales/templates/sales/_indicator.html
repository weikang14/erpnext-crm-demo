{% if deal.indicator == "overdue" %}<span class="ind ind-overdue">Overdue activity</span>{% elif deal.indicator == "today" %}<span class="ind ind-today">Activity today</span>{% elif deal.indicator == "none" %}<span class="ind ind-none">No next activity</span>{% else %}<span class="ind ind-future">Next {{ deal.next_due|date:"j M" }}</span>{% endif %}{% if deal.stale %} <span class="chip chip-amber">Stale</span>{% endif %}
