{% extends "terminal/base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<main class="signin">
  <h1 class="signin__title">Ombak Shop Floor</h1>
  <form method="post" class="panel stack">
    {% csrf_token %}
    {% if form.non_field_errors %}<p class="banner banner--error" role="alert">Wrong username or password.</p>{% endif %}
    <label class="field">Username
      <input type="text" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
    </label>
    <label class="field">Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn--primary">Sign in</button>
  </form>
</main>
{% endblock %}
